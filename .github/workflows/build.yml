name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install "buildozer<3.0.0" "cython<3.0.0"

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential ccache git python3-pip libffi-dev libssl-dev libopenjp2-7-dev libtiff5-dev zlib1g-dev libjpeg-dev libgl1-mesa-dev libgles2-mesa-dev unzip zip lld

    - name: Build APK with Buildozer
      run: |
        yes | buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: adex-ai-apk
        path: bin/*.apk
        
